name: Arancel de Aduanas (DIAN)

on:
  schedule:
    # Lunes 05:30 UTC. El arancel cambia por decreto, pocas veces al mes.
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gela-data-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install requests
      - name: Actualizar
        run: python arancel/update.py
      - name: Guardar si cambió
        if: always()
        run: |
          git config user.name "gela-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add arancel
          python3 tools/guard.py --staged
          git diff --cached --quiet || git commit -m "Arancel de Aduanas actualizado ($(date -u +%F))"
          git pull --rebase origin main && git push
