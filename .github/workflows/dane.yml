name: DANE exportaciones (WOI)

on:
  schedule:
    # Lunes 06:00 UTC: el DANE publica a comienzos de mes; solo se baja lo que cambió.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rehacer todo aunque no haya cambios'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install pandas requests pycountry openpyxl pyreadstat
      - name: Actualizar
        run: python dane/update.py ${{ inputs.force && '--force' || '' }}
      - name: Guardar si cambió
        run: |
          git config user.name "gela-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add dane
          git diff --cached --quiet || git commit -m "DANE: exportaciones actualizadas ($(date -u +%F))"
          git push
